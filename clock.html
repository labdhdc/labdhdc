<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Until 1 November</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4efe3; --ink:#1c3326; --soft:#4f6b5a; --line:#b7cfbc; --track:rgba(28,51,38,.1); --disc:rgba(255,255,255,.5);
  --cd:#4b5bd6;
  --paper:#fbf9f1; --paper-ink:#1c3326; --paper-soft:#86948b; --paper-line:#e3e0d2; --pen:#d9412f;
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1f17; --ink:#e6f2e8; --soft:#9db9a6; --line:#2a4234; --track:rgba(230,242,232,.12); --disc:rgba(255,255,255,.04);
    --cd:#8da2ff;
    --paper:#ece8da; --paper-line:#d5d0bd; --paper-soft:#7b857d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1f17; --ink:#e6f2e8; --soft:#9db9a6; --line:#2a4234; --track:rgba(230,242,232,.12); --disc:rgba(255,255,255,.04);
  --cd:#8da2ff;
  --paper:#ece8da; --paper-line:#d5d0bd; --paper-soft:#7b857d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%; margin:0}
html{background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

/* background animation: slow drifting colour glows and small rising specks */
.bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.bg i{position:absolute; border-radius:50%; will-change:transform}
.bg .b{
  width:62vmax; height:62vmax; left:var(--l); top:var(--t); margin:-31vmax 0 0 -31vmax;
  background:radial-gradient(circle,var(--c) 0,transparent 62%);
  animation:drift var(--dur) ease-in-out infinite alternate;
}
.bg .dot{bottom:-1rem; left:var(--x); width:var(--s); height:var(--s); background:var(--ink); opacity:0; animation:rise var(--dur) linear var(--delay) infinite}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(var(--dx),var(--dy),0) scale(1.18)}}
@keyframes rise{
  0%{transform:translate3d(0,0,0); opacity:0}
  10%{opacity:.18}
  90%{opacity:.18}
  100%{transform:translate3d(var(--sway),-115vh,0); opacity:0}
}

.stage{
  position:relative; z-index:1; height:100%; padding:clamp(1rem,3.5vmin,6rem) clamp(1.25rem,5vmin,8rem);
  display:grid; gap:clamp(.5rem,1.8vmin,3rem);
  grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"to" "main" "cal";
}
.to{grid-area:to; margin:0; font-size:clamp(1.05rem,2.8vmin,1.6rem); font-weight:700}

/* two views share one spot and swap every 5 seconds */
.main{grid-area:main; position:relative; display:grid; min-height:0; min-width:0}
.view{
  grid-area:1/1; min-height:0; min-width:0;
  opacity:0; visibility:hidden; transform:translateY(3vh) scale(.96); filter:blur(10px);
  transition:opacity .8s ease, transform .9s var(--ease), filter .8s ease, visibility 0s linear .9s;
}
.view.on{opacity:1; visibility:visible; transform:none; filter:none; transition:opacity .8s ease, transform .9s var(--ease), filter .8s ease, visibility 0s}
.cycle{position:absolute; left:0; right:0; bottom:0; height:max(.15rem,.4vh); background:var(--line); border-radius:9rem; overflow:hidden}
.cycle i{display:block; height:100%; background:var(--cd); transform-origin:left; transform:scaleX(0)}
.cycle.go i{animation:fill 5s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes enter{from{opacity:0; transform:translateY(3vh)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.82)} to{opacity:1; transform:none}}

/* view 1: days ring and the time left today */
.count{display:grid; grid-template-rows:minmax(0,1fr) auto; gap:clamp(.5rem,1.8vmin,3rem); padding-bottom:clamp(.6rem,1.6vmin,2rem)}
.dial{container-type:size; min-height:0; display:grid; place-items:center}
.ring{position:relative; width:min(100cqw,100cqh); height:min(100cqw,100cqh)}
.ring svg{position:absolute; inset:0; width:100%; height:100%}
.track{fill:none; stroke:var(--track); stroke-width:16}
.arc{fill:none; stroke:var(--cd); stroke-width:16; stroke-linecap:round; transform:rotate(-90deg); transform-origin:200px 200px; transition:stroke-dashoffset 1.8s var(--ease)}
.disc{fill:var(--disc)}
.center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.days{font-family:Gloock,Georgia,"Times New Roman",serif; font-size:min(56cqw,56cqh); line-height:.9; letter-spacing:-.02em}
.dl{display:flex; align-items:center; gap:.4em; font-size:min(7cqw,7cqh); font-weight:800; margin-top:.1em}
.dl i{width:.6em; height:.6em; border-radius:50%; background:var(--cd)}
.legend{list-style:none; margin:0; padding:0; display:flex; justify-content:space-around; gap:1rem}
.legend li{display:flex; flex-direction:column; align-items:center}
.legend b{font-size:clamp(1.7rem,min(8vw,5vh),3.2rem); font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.cap{margin-top:.2rem; color:var(--soft); font-size:clamp(.9rem,2vmin,1.15rem); font-weight:500}
.on .ring{animation:pop 1s var(--ease) both}
.on .legend li{animation:enter .9s var(--ease) both; animation-delay:calc(.3s + var(--i) * .1s)}

/* view 2: the clock, with the time as large as it can be */
.clock{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:clamp(.5rem,2.2vh,3rem); padding-bottom:clamp(.6rem,1.6vmin,2rem)}
.time{display:flex; align-items:flex-end; justify-content:center; gap:.08em; font-size:min(21vw,16vh); font-variant-numeric:tabular-nums}
.hm{font-weight:800; line-height:.85; letter-spacing:-.03em}
.rest{display:flex; flex-direction:column; align-items:flex-start; line-height:1; padding-bottom:.04em}
.ss{font-size:.42em; font-weight:700; color:var(--cd)}
.ap{font-size:.28em; font-weight:800; color:var(--soft); margin-top:.15em}
.date{font-size:clamp(1.3rem,6.2vw,2.4rem); font-weight:800; line-height:1.1; text-wrap:balance}
.tz{color:var(--soft); font-size:clamp(.85rem,1.9vmin,1.05rem); font-weight:500}
.on .time{animation:enter 1s var(--ease) .1s both}
.on .date{animation:enter 1s var(--ease) .3s both}
.on .tz{animation:enter 1s var(--ease) .45s both}

/* wall calendar */
.cal{
  grid-area:cal; --cell:clamp(1.6rem,4.6vh,3rem);
  background:var(--paper); color:var(--paper-ink); position:relative;
  border-radius:.4rem; padding:1.5rem clamp(.75rem,2.5vw,1.5rem) .8rem; transform:rotate(1.2deg);
  box-shadow:0 1.2rem 2rem -1rem rgba(0,0,0,.5), 0 .1rem .25rem rgba(0,0,0,.2);
  width:100%; max-width:30rem; justify-self:center; align-self:center;
}
.cal::before,.cal::after{
  content:""; position:absolute; top:.5rem; width:.7rem; height:.7rem; border-radius:50%;
  background:var(--bg); box-shadow:inset 0 .1rem .15rem rgba(0,0,0,.45);
}
.cal::before{left:28%} .cal::after{right:28%}
.cal h2{margin:0 0 .35rem; font-family:Gloock,Georgia,serif; font-weight:400; font-size:clamp(1.2rem,3vmin,1.6rem); text-align:center}
.wds,.grid{display:grid; grid-template-columns:repeat(7,1fr)}
.wd{text-align:center; font-size:.8rem; font-weight:700; color:var(--paper-soft); padding-bottom:.2rem}
.grid{grid-auto-rows:var(--cell)}
.d{
  position:relative; display:grid; place-items:center; border-top:.0625rem solid var(--paper-line);
  font-size:clamp(.85rem,calc(var(--cell)*.42),8rem); font-weight:700;
}
.d.past{color:var(--paper-soft); font-weight:500}
.d.past::after{
  content:""; position:absolute; inset:16% 20%; transform:rotate(var(--r,0deg)); opacity:.9;
  background:
    linear-gradient(to top right,transparent calc(50% - .075rem),var(--pen) calc(50% - .075rem) calc(50% + .075rem),transparent calc(50% + .075rem)),
    linear-gradient(to bottom right,transparent calc(50% - .075rem),var(--pen) calc(50% - .075rem) calc(50% + .075rem),transparent calc(50% + .075rem));
}
.d.today::after{
  content:""; position:absolute; inset:5% 10%; border:.16rem solid var(--pen);
  border-radius:52% 48% 55% 45% / 47% 56% 44% 53%; transform:rotate(-7deg);
}
.d.target span{
  background:var(--pen); color:#fff; width:86%; height:92%; display:grid; place-items:center;
  border-radius:48% 52% 46% 54% / 52% 46% 54% 48%; font-size:.68em; line-height:1; text-align:center;
}

/* big screens (4K and up): scale rem-based details so lines and spacing keep their proportions */
@media (min-width:1921px) and (min-height:1081px){
  html{font-size:max(100%, min(.8333vw, 1.4815vh))}
}

/* landscape screens: everything is sized from the screen height so it grows with the display */
@media (min-aspect-ratio:7/5){
  .stage{
    grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"to to" "main cal"; column-gap:clamp(1.5rem,5vw,8rem);
  }
  .to{font-size:clamp(1.05rem,3.4vh,6rem)}
  .legend b{font-size:clamp(2rem,8.5vh,12rem)}
  .cap{font-size:clamp(.95rem,2.6vh,4rem)}
  .time{font-size:min(20vh,10vw)}
  .date{font-size:min(6vh,3.2vw)}
  .tz{font-size:clamp(.85rem,2.2vh,3rem)}
  .cal{
    --cell:clamp(2rem,8.8vh,14rem);
    width:calc(var(--cell) * 7.6); max-width:100%;
    padding:calc(var(--cell) * .55) calc(var(--cell) * .3) calc(var(--cell) * .3);
  }
  .cal::before,.cal::after{top:calc(var(--cell) * .15); width:calc(var(--cell) * .2); height:calc(var(--cell) * .2)}
  .cal h2{font-size:clamp(1.2rem,3.4vh,5.5rem); margin-bottom:calc(var(--cell) * .1)}
  .wd{font-size:clamp(.8rem,2vh,3rem)}
}
@media (max-height:700px){
  .cal h2,.wds{display:none}
  .cal{padding-top:1.2rem}
}
@media (prefers-reduced-motion: reduce){
  .bg i{animation:none} .bg .dot{display:none}
  .view,.view.on{transition:none}
  .on .ring,.on .legend li,.on .time,.on .date,.on .tz,.cycle.go i{animation:none}
  .arc{transition:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <i class="b" style="--l:15%;--t:25%;--c:rgba(91,110,230,.30);--dx:18vw;--dy:10vh;--dur:26s"></i>
  <i class="b" style="--l:85%;--t:20%;--c:rgba(46,160,120,.32);--dx:-16vw;--dy:14vh;--dur:32s"></i>
  <i class="b" style="--l:70%;--t:90%;--c:rgba(220,80,140,.20);--dx:-20vw;--dy:-12vh;--dur:30s"></i>
  <i class="b" style="--l:10%;--t:95%;--c:rgba(240,140,60,.22);--dx:16vw;--dy:-14vh;--dur:36s"></i>
</div>

<main class="stage">
  <p class="to">Until 1 November 2026</p>

  <section class="main" aria-live="off">
    <div class="view count on" id="vCount">
      <div class="dial" aria-label="Days remaining">
        <div class="ring">
          <svg viewBox="0 0 400 400" aria-hidden="true">
            <circle class="disc" cx="200" cy="200" r="158"/>
            <circle class="track" cx="200" cy="200" r="176"/>
            <circle class="arc" id="aD" cx="200" cy="200" r="176"/>
          </svg>
          <div class="center">
            <div class="days" id="days">0</div>
            <div class="dl"><i></i><span id="dl">days to go</span></div>
          </div>
        </div>
      </div>
      <ul class="legend" aria-label="Time left in the final day">
        <li style="--i:0"><b id="h">00</b><span class="cap" id="hl">hours</span></li>
        <li style="--i:1"><b id="m">00</b><span class="cap" id="ml">minutes</span></li>
        <li style="--i:2"><b id="s">00</b><span class="cap" id="sl">seconds</span></li>
      </ul>
    </div>

    <div class="view clock" id="vClock" aria-hidden="true">
      <div class="time"><span class="hm" id="hm">0:00</span><span class="rest"><span class="ss" id="ss">:00</span><span class="ap" id="ap">am</span></span></div>
      <div class="date" id="date"></div>
      <div class="tz" id="tz"></div>
    </div>

    <div class="cycle" id="cycle" aria-hidden="true"><i></i></div>
  </section>

  <section class="cal" aria-label="October 2026 calendar">
    <h2>October 2026</h2>
    <div class="wds" id="wds"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
(function(){
  var target = new Date(2026, 10, 1, 0, 0, 0); // midnight at the start of 1 November, local time
  var ringStart = new Date(2026, 9, 11, 0, 0, 0); // the days ring counts down from 11 October
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return String(n).padStart(2, "0"); };
  var pl = function(n, a, b){ return n === 1 ? a : b; };
  var last = {};
  function put(id, v){ if (last[id] !== v){ last[id] = v; $(id).textContent = v; } }
  try { $("tz").textContent = "Time zone: " + Intl.DateTimeFormat().resolvedOptions().timeZone.replace("_", " "); } catch(e) {}

  var ring = $("aD"), C = 2 * Math.PI * 176, frac = 1, shown = -1;
  ring.style.strokeDasharray = C;
  function setRing(){ shown = frac; ring.style.strokeDashoffset = C * (1 - frac); }
  function redrawRing(){ // draw the ring in from empty each time the countdown view comes back
    ring.style.transition = "none"; ring.style.strokeDashoffset = C; void ring.getBoundingClientRect();
    ring.style.transition = ""; setRing();
  }

  $("wds").innerHTML = "MTWTFSS".split("").map(function(w){ return '<div class="wd">' + w + '</div>'; }).join("");
  var builtFor = "";
  function buildCal(now){
    var key = now.toDateString();
    if (key === builtFor) return;
    builtFor = key;
    var html = "", offset = (new Date(2026, 9, 1).getDay() + 6) % 7; // weeks start on Monday
    for (var i = 0; i < offset; i++) html += "<div></div>";
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    for (var d = 1; d <= 31; d++){
      var date = new Date(2026, 9, d), cls = "d";
      if (date < today) cls += " past"; else if (+date === +today) cls += " today";
      html += '<div class="' + cls + '" style="--r:' + (((d * 37) % 17) - 8) + 'deg">' + d + '</div>'; // fixed wobble so crosses look hand drawn
    }
    html += '<div class="d target"><span>1<br>Nov</span></div>';
    $("grid").innerHTML = html;
  }

  var fmt = new Intl.DateTimeFormat("en-GB", {hour:"numeric", minute:"2-digit", second:"2-digit", hour12:true});
  function tick(){
    var now = new Date(), diff = target - now;
    buildCal(now);

    var p = {}; fmt.formatToParts(now).forEach(function(x){ p[x.type] = x.value; });
    put("hm", p.hour + ":" + p.minute); put("ss", ":" + p.second); put("ap", p.dayPeriod || "");
    put("date", now.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"}));

    if (diff <= 0){
      put("days", "0"); put("dl", "It’s here");
      put("h", "00"); put("m", "00"); put("s", "00");
      frac = 0; if (shown !== 0) setRing();
      document.title = "It’s 1 November";
      return;
    }
    frac = Math.min(1, diff / (target - ringStart));
    if (Math.abs(frac - shown) > 0.0002) setRing(); // the ring only needs to move a little every few minutes

    var d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5),
        m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
    put("days", String(d)); put("dl", pl(d, "day", "days") + " to go");
    put("h", pad(h)); put("m", pad(m)); put("s", pad(s));
    put("hl", pl(h, "hour", "hours")); put("ml", pl(m, "minute", "minutes")); put("sl", pl(s, "second", "seconds"));
    var t = d + " " + pl(d, "day", "days") + " to go";
    if (document.title !== t) document.title = t;
    setTimeout(tick, 1000 - (Date.now() % 1000));
  }
  tick();
  redrawRing();

  // swap between the countdown and the clock every 5 seconds
  var vCount = $("vCount"), vClock = $("vClock"), cycle = $("cycle"), showing = "count";
  function restartBar(){ cycle.classList.remove("go"); void cycle.offsetWidth; cycle.classList.add("go"); }
  function show(which){
    showing = which;
    vCount.classList.toggle("on", which === "count"); vCount.setAttribute("aria-hidden", which !== "count");
    vClock.classList.toggle("on", which === "clock"); vClock.setAttribute("aria-hidden", which !== "clock");
    if (which === "count") redrawRing();
    restartBar();
  }
  restartBar();
  setInterval(function(){ show(showing === "count" ? "clock" : "count"); }, 5000);

  var bg = document.querySelector(".bg");
  if (!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)){
    for (var k = 0; k < 16; k++){
      var dot = document.createElement("i");
      dot.className = "dot";
      dot.style.cssText = "--x:" + (Math.random() * 100).toFixed(1) + "%;--s:" + (.25 + Math.random() * .55).toFixed(2) + "rem;--dur:" + (22 + Math.random() * 26).toFixed(1) + "s;--delay:-" + (Math.random() * 40).toFixed(1) + "s;--sway:" + (Math.random() * 10 - 5).toFixed(1) + "vw";
      bg.appendChild(dot);
    }
  }
})();
</script>
</body>
</html>
