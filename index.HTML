<html lang="en">
<head>

  <link rel="icon" type="image/x-icon" href="https://i.ibb.co/tw6WY1Kd/png-transparent-skill-organization-uttar-pradesh-sales-marketing-registration-acts-text-logo-electri.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0c0f2d 0%, #132e5c 50%, #194080 100%);
      min-height: 100vh;
      color: #fff;
      position: relative;
      overflow-x: hidden;
    }

    #canvas-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }

    h1, h2, h3, h4, h5 {
      font-family: 'Montserrat', sans-serif;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      opacity: 0;
      transform: translateY(-20px);
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #ffffff, #74ebd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.1rem;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 2.5rem;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      margin-bottom: 2rem;
      position: relative;
      overflow: visible; /* Changed to visible for dropdown */
      opacity: 0;
      transform: scale(0.95);
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 80%);
      transform: rotate(0deg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: -1;
    }

    .glass-card:hover::before {
      opacity: 1;
      animation: rotate-light 8s linear infinite;
    }

    @keyframes rotate-light {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .form-group {
      margin-bottom: 1.8rem;
      position: relative;
      opacity: 0;
      transform: translateX(-20px);
    }

    .form-group label {
      display: block;
      margin-bottom: 0.8rem;
      font-weight: 500;
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.5px;
    }

    .form-group label i {
      margin-right: 8px;
      color: #74ebd5;
    }

    .form-control {
      width: 100%;
      padding: 1rem 1.2rem;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 12px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: #74ebd5;
      box-shadow: 0 0 15px rgba(116, 235, 213, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }
    
    /* Readonly styling */
    .form-control[readonly] {
      background: rgba(0, 0, 0, 0.2);
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    /* Auto-complete Dropdown */
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 250px;
      overflow-y: auto;
      background: rgba(16, 26, 61, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(116, 235, 213, 0.3);
      border-top: none;
      border-radius: 0 0 12px 12px;
      z-index: 1000;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .suggestions-list.show {
      display: block;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s;
      font-size: 0.95rem;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: rgba(116, 235, 213, 0.15);
      color: #74ebd5;
    }
    
    .suggestion-detail {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-left: 8px;
    }

    /* Scrollbar for suggestions */
    .suggestions-list::-webkit-scrollbar {
      width: 8px;
    }
    .suggestions-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    .suggestions-list::-webkit-scrollbar-thumb {
      background: rgba(116, 235, 213, 0.3);
      border-radius: 4px;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 1rem;
      pointer-events: none; /* Disable manual selection */
      opacity: 0.8;
    }

    .radio-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radio-item input[type="radio"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .radio-item label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3.2rem;
      height: 3.2rem;
      margin: 0;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: default; /* Changed cursor */
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .radio-item input[type="radio"]:checked + label {
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      border-color: transparent;
      color: #0c1339;
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(116, 235, 213, 0.3);
    }

    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background: linear-gradient(90deg, #74ebd5, #9face6);
      color: #0c1339;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      margin-top: 1rem;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(116, 235, 213, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s ease;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .input-icon {
      position: absolute;
      right: 1rem;
      top: 55%;
      color: rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    .form-control:focus ~ .input-icon {
      color: #74ebd5;
    }

    .validation-msg {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s ease;
      height: 0;
      overflow: hidden;
    }

    .validation-msg.error {
      color: #ff6b6b;
      opacity: 1;
      height: auto;
    }

    .validation-msg.success {
      color: #74ebd5;
      opacity: 1;
      height: auto;
    }

    /* Success overlay */
    .success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .success-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .success-content {
      text-align: center;
      transform: scale(0.8);
      transition: all 0.5s ease;
      max-width: 90%;
    }

    .success-overlay.visible .success-content {
      transform: scale(1);
    }

    .success-icon {
      font-size: 5rem;
      color: #74ebd5;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    .success-title {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: white;
      font-weight: 700;
    }

    .success-message {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2rem;
    }

    .success-btn {
      padding: 1rem 2rem;
      background: linear-gradient(90deg, #74ebd5, #9face6);
      color: #0c1339;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .success-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(116, 235, 213, 0.4);
    }

    /* Loading indicator */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #74ebd5;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .hidden-frame {
      display: none;
    }

    .floating-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
      }
      25% {
        transform: translateY(-30px) translateX(15px);
      }
      50% {
        transform: translateY(-10px) translateX(30px);
      }
      75% {
        transform: translateY(-20px) translateX(-15px);
      }
    }

    /* Error Alert */
    .error-alert {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 82, 82, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 10px 30px rgba(255, 82, 82, 0.5);
      z-index: 1000;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    .error-alert.show {
      top: 20px;
    }

    .error-alert i {
      font-size: 1.5rem;
    }

    .error-alert p {
      font-weight: 500;
    }

    .error-alert .close-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      opacity: 0.8;
      transition: opacity 0.3s;
      margin-left: 1rem;
    }

    .error-alert .close-btn:hover {
      opacity: 1;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 1.5rem 0;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(20px);
    }

    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }

      .glass-card {
        padding: 1.8rem;
      }

      .header h1 {
        font-size: 2rem;
      }

      .radio-group {
        gap: 8px;
      }

      .radio-item label {
        width: 2.8rem;
        height: 2.8rem;
        font-size: 1rem;
      }
    }

    /* Animations for PDF rendering */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }

      .glass-card, .container, .header, .form-group, .submit-btn, .footer {
        opacity: 1 !important;
        transform: none !important;
      }

      .glass-card {
        background: white !important;
        box-shadow: none !important;
        border: 1px solid #ddd !important;
      }

      .form-control, .radio-item label {
        background: white !important;
        border: 1px solid #ddd !important;
        color: black !important;
      }

      .submit-btn, .header h1 {
        background: white !important;
        color: black !important;
        -webkit-text-fill-color: black !important;
      }

      #canvas-background, .floating-particles {
        display: none !important;
      }
    }
  </style>
</head>

    // Audio Context for Sound Effects
    let audioContext;
    
    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Success Sound Effect
    function playSuccessSound() {
      initAudioContext();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      // Create a pleasant success chime
      oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
      oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
      oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
      
      gainNode.gain.setValueAtTime(0, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
      
      oscillator.type = 'sine';
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.5);
    }

    // Error Sound Effect
    function playErrorSound() {
      initAudioContext();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      // Create an error buzz sound
      oscillator.frequency.setValueAtTime(220, audioContext.currentTime); // A3
      oscillator.frequency.setValueAtTime(196, audioContext.currentTime + 0.1); // G3
      oscillator.frequency.setValueAtTime(174.61, audioContext.currentTime + 0.2); // F3
      
      gainNode.gain.setValueAtTime(0, audioContext.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
      
      oscillator.type = 'sawtooth';
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.4);
    }

    // Click Sound Effect
    function playClickSound() {
      initAudioContext();
      
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.type = 'square';
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    (function() {

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true

        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 5;
      
      // Create stars
      const starGeometry = new THREE.BufferGeometry();
      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        transparent: true
      });
      
      const starVertices = [];
      for (let i = 0; i < 6000; i++) {
        const x = (Math.random() - 0.5) * 10;
        const y = (Math.random() - 0.5) * 10;
        const z = (Math.random() - 0.5) * 10;
        starVertices.push(x, y, z);

      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);
      
      // Add light

      scene.add(ambientLight);
      
      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        
        stars.rotation.x += 0.0002;
        stars.rotation.y += 0.0003;
        
        renderer.render(scene, camera);
      }
      
      animate();
      
      // Resize handling
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

    // Floating particles
    (function() {
      const particlesContainer = document.querySelector('.floating-particles');
      const numberOfParticles = 20;
      
      for (let i = 0; i < numberOfParticles; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random position
        const xPos = Math.random() * 100;
        const yPos = Math.random() * 100;
        
        // Random size
        const size = Math.random() * 5 + 3;
        
        // Random opacity
        const opacity = Math.random() * 0.5 + 0.1;
        
        // Random animation delay
        const delay = Math.random() * 5;
        
        // Random animation duration
        const duration = Math.random() * 10 + 10;
        
        particle.style.left = `${xPos}%`;
        particle.style.top = `${yPos}%`;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.opacity = opacity;
        particle.style.animationDelay = `${delay}s`;
        particle.style.animationDuration = `${duration}s`;
        
        particlesContainer.appendChild(particle);
      }
    })();

    // Elements Animation
    (function() {
      gsap.to('.header', {
        opacity: 1,
        y: 0,
        duration: 1,
        ease: 'power3.out'
      });
      
      gsap.to('.glass-card', {
        opacity: 1,
        scale: 1,
        duration: 1,
        delay: 0.3,
        ease: 'power3.out'
      });
      
      const formGroups = document.querySelectorAll('.form-group');
      formGroups.forEach((group, index) => {
        gsap.to(group, {
          opacity: 1,
          x: 0,
          duration: 0.7,
          delay: 0.5 + (index * 0.1),
          ease: 'power3.out'
        });
      });
      
      gsap.to('.submit-btn', {
        opacity: 1,
        y: 0,
        duration: 0.7,
        delay: 1.1,
        ease: 'power3.out'
      });
      
      gsap.to('.footer', {
        opacity: 1,
        y: 0,
        duration: 0.7,
        delay: 1.3,
        ease: 'power3.out'
      });
    })();

    // Form Logic & Auto-complete
    (function() {
      const form = document.getElementById('registration-form');
      const nameInput = document.getElementById('name');
      const admissionInput = document.getElementById('admission-number');
      const suggestionsBox = document.getElementById('name-suggestions');
      const timeField = document.getElementById('usage-time');
      const nameValidation = document.getElementById('name-validation');
      const timeValidation = document.getElementById('time-validation');
      
      // Auto-complete Search Logic
      nameInput.addEventListener('input', function() {
        const val = this.value.toLowerCase().trim();
        suggestionsBox.innerHTML = '';
        
        if (val.length < 1) {
            suggestionsBox.classList.remove('show');
            return;
        }

        const matches = studentData.filter(student => 
            student.n.toLowerCase().includes(val) || student.a.includes(val)
        );

        if (matches.length > 0) {
            matches.forEach(student => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                // Highlight the matching part is complex, keeping it simple for now
                item.innerHTML = `
                    <div class="font-bold">${student.n}</div>
                    <div class="suggestion-detail">Class: ${student.c} | Ad No: ${student.a}</div>
                `;
                item.addEventListener('click', function() {
                    selectStudent(student);
                });
                suggestionsBox.appendChild(item);
            });
            suggestionsBox.classList.add('show');
        } else {
            suggestionsBox.classList.remove('show');
        }
      });

      // Handle clicking outside to close suggestions
      document.addEventListener('click', function(e) {
        if (e.target !== nameInput && e.target !== suggestionsBox) {
            suggestionsBox.classList.remove('show');
        }
      });

      function selectStudent(student) {
        // Set Name
        nameInput.value = student.n;
        
        // Set Admission Number
        admissionInput.value = student.a;
        
        // Select Class Radio Button
        const radioBtn = document.querySelector(`input[name="entry.404446683"][value="${student.c}"]`);
        if (radioBtn) {
            radioBtn.checked = true;
            // Trigger visual update for radio
            updateRadioVisuals(radioBtn);
        }

        // Hide suggestions
        suggestionsBox.classList.remove('show');
        
        // Validate immediately
        validateName();
        playClickSound();
      }

      function updateRadioVisuals(checkedInput) {
        // Reset all visuals
        const allRadios = document.querySelectorAll('.radio-item');
        allRadios.forEach(item => {
            gsap.to(item.querySelector('label'), {
              y: 0,
              scale: 1,
              backgroundColor: 'rgba(255, 255, 255, 0.05)',
              color: 'white',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              boxShadow: 'none',
              duration: 0.3
            });
        });

        // Animate selected
        const selectedLabel = checkedInput.nextElementSibling;
        gsap.to(selectedLabel, {
          y: -5,
          scale: 1.05,
          backgroundColor: 'rgb(116, 235, 213)',
          backgroundImage: 'linear-gradient(135deg, rgb(116, 235, 213) 0%, rgb(159, 172, 230) 100%)',
          color: '#0c1339',
          borderColor: 'transparent',
          boxShadow: '0 10px 20px rgba(116, 235, 213, 0.3)',
          duration: 0.3
        });
      }

      // Validation Functions
      function validateName() {
        if (nameInput.value.trim() === '') {
          nameValidation.textContent = 'Name is required';
          nameValidation.className = 'validation-msg error';
          return false;
        } else if (admissionInput.value === '') {
          nameValidation.textContent = 'Please select a valid name from the list';
          nameValidation.className = 'validation-msg error';
          return false;
        } else {
          nameValidation.textContent = '';
          nameValidation.className = 'validation-msg success';
          return true;
        }
      }
      
      function validateTime() {
        if (timeField.value.trim() === '') {
          timeValidation.textContent = 'Usage time is required';
          timeValidation.className = 'validation-msg error';
          return false;
        } else if (parseInt(timeField.value) < 1) {
          timeValidation.textContent = 'Usage time must be at least 1 minute';
          timeValidation.className = 'validation-msg error';
          return false;
        } else {
          timeValidation.textContent = '';
          timeValidation.className = 'validation-msg success';
          return true;
        }
      }
      
      nameInput.addEventListener('input', function() {
          // If user types manually after selection, clear admission number to force re-selection
          if (admissionInput.value !== '') {
             admissionInput.value = '';
             // Reset radio visuals
             document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
             document.querySelectorAll('.radio-item label').forEach(l => {
                l.style = ""; // Reset inline styles from gsap
             });
          }
      });
      timeField.addEventListener('input', validateTime);
      
      // Form submission
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const isNameValid = validateName();
        const isTimeValid = validateTime();
        
        if (isNameValid && isTimeValid) {
          submitForm();
        } else {
          playErrorSound();
        }
      });
      
      function submitForm() {
        const loadingOverlay = document.getElementById('loading-overlay');
        loadingOverlay.classList.add('visible');
        
        // Form data
        const formData = new FormData(form);
        
        // Create URL-encoded form data
        const urlEncodedData = new URLSearchParams(formData).toString();
        
        // Send form data via fetch
        fetch('https://docs.google.com/forms/d/e/1FAIpQLSdzkhhi9MjDquwtI7pXpA__jrVh3m-ATXXihQ5ncP58sGGpvg/formResponse', {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: urlEncodedData
        })
        .then(() => {
          setTimeout(() => {
            loadingOverlay.classList.remove('visible');
            showSuccessMessage();
          }, 1000);
        })
        .catch(error => {
          console.error('Form submission error:', error);
          setTimeout(() => {
            loadingOverlay.classList.remove('visible');
            showSuccessMessage();
          }, 1000);
        });
      }
    })();

    // Success Message
    function showSuccessMessage() {
      playSuccessSound();
      
      const successOverlay = document.getElementById('success-overlay');
      successOverlay.classList.add('visible');
      
      // Trigger confetti
      const duration = 3000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 101 };
      
      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }
      
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        
        const particleCount = 50 * (timeLeft / duration);
        
        confetti({
          ...defaults,
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        });
        confetti({
          ...defaults,
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        });
      }, 250);
    }
    
    // Success button event
    document.getElementById('success-btn').addEventListener('click', function() {
      playClickSound();
      
      const successOverlay = document.getElementById('success-overlay');
      successOverlay.classList.remove('visible');
      
      // Reset form
      document.getElementById('registration-form').reset();
      
      // Reset visuals
      const validationMsgs = document.querySelectorAll('.validation-msg');
      validationMsgs.forEach(msg => {
        msg.textContent = '';
        msg.className = 'validation-msg';
      });
      
      // Reset radio visuals
        document.querySelectorAll('.radio-item label').forEach(l => {
           l.style = "";
        });
    });
    
    // Error alert handling
    document.getElementById('close-error').addEventListener('click', function() {
      playClickSound();
      document.getElementById('error-alert').classList.remove('show');
    });

    // Add sound effects to buttons and interactive elements
    document.querySelector('.submit-btn').addEventListener('click', function() {
      playClickSound();
    });

    // Add click sounds to form inputs
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        playClickSound();
      });
    });
  </script>
</body>
</html>
